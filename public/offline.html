<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Sin conexión · JP Preparation</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
             background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
        main{max-width:380px}
        .ico{font-size:56px;line-height:1;margin-bottom:16px}
        h1{font-size:1.35rem;margin:0 0 8px}
        p{margin:0 0 24px;color:#94a3b8;line-height:1.5}
        button{background:#3b82f6;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:1rem;font-weight:600;cursor:pointer}
        button:active{background:#1d4ed8}
    </style>
</head>
<body>
<main>
    <div class="ico" aria-hidden="true">📡</div>
    <h1>Sin conexión</h1>
    <p>No hemos podido conectar con la plataforma. Comprueba tu conexión a internet e inténtalo de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
